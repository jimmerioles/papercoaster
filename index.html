<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f6c9a8" />
    <meta name="description" content="Papercoaster: draw a line, ride it. A three.js feel test." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23fff7eb'/%3E%3Cpath d='M10 46c8-20 16-26 24-14s12 6 20-12' fill='none' stroke='%23e85d3f' stroke-width='6' stroke-linecap='round'/%3E%3C/svg%3E" />
    <title>Papercoaster</title>
  </head>
  <body>
    <div id="app"></div>

    <div id="ui">
      <div class="vignette" aria-hidden="true"></div>
      <div class="grain" aria-hidden="true"></div>

      <section id="start-screen" class="screen">
        <div class="card">
          <p class="eyebrow">A three.js feel test</p>
          <h1>Papercoaster</h1>
          <p class="tagline">Draw a line. Ride it.</p>
          <button id="start-button" type="button">Ride the test track</button>
          <p class="note">Fixed track. The drawing comes next.</p>
        </div>
      </section>

      <section id="hud" class="hidden" aria-hidden="true">
        <div class="speed">
          <span id="speed-value">0</span>
          <span class="unit">km/h</span>
        </div>
        <div class="progress"><div id="progress-fill"></div></div>
        <p class="hint">C for comfort view</p>
      </section>

      <section id="end-screen" class="screen hidden">
        <div class="card">
          <p class="eyebrow">Test track complete</p>
          <h2>Nice line.</h2>
          <p class="result">Top speed <strong id="max-speed">0</strong> km/h</p>
          <button id="again-button" type="button">Ride again</button>
        </div>
      </section>

      <button id="mute-button" class="icon-button hidden" type="button" aria-label="Toggle sound">
        <span id="mute-icon">Sound on</span>
      </button>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
